model:
  name: google/vit-base-patch16-224
  type: vit
  num_classes: 10
lora:
  r: 8
  lora_alpha: 16
  target_modules: ["query", "value"]
  lora_dropout: 0.1
  bias: "none"
training:
  epochs: 20
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_ratio: 0.1
  fp16: true
data:
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  image_size: 224
